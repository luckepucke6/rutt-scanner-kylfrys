<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rutt-scanner</title>
  <style>
    :root {
      --color-bg: #f2f2f7;
      --color-surface: #ffffff;
      --color-surface-2: #f9f9fb;
      --color-border: rgba(0, 0, 0, 0.10);
      --color-border-strong: rgba(0, 0, 0, 0.18);
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #6b6b6b;
      --color-text-tertiary: #aeaeb2;
      --color-accent: #007aff;
      --color-accent-fg: #ffffff;
      --color-accent-soft: #e8f0fe;
      --color-success: #28a745;
      --color-success-bg: #f0faf3;
      --color-success-border: rgba(40, 167, 69, 0.30);
      --color-error: #dc3545;
      --color-error-bg: #fff5f6;
      --color-error-border: rgba(220, 53, 69, 0.30);
      --color-warning: #fd7e14;
      --color-pending-bg: #f9f9fb;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 5px;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #000000;
        --color-surface: #1c1c1e;
        --color-surface-2: #2c2c2e;
        --color-border: rgba(255, 255, 255, 0.10);
        --color-border-strong: rgba(255, 255, 255, 0.20);
        --color-text-primary: #f2f2f7;
        --color-text-secondary: #8e8e93;
        --color-text-tertiary: #48484a;
        --color-accent-soft: #0a2540;
        --color-success-bg: #0c2013;
        --color-success-border: rgba(40, 167, 69, 0.35);
        --color-error-bg: #200c0d;
        --color-error-border: rgba(220, 53, 69, 0.35);
        --color-pending-bg: #2c2c2e;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text-primary);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      padding: 16px 16px 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .header-icon {
      width: 38px;
      height: 38px;
      background: var(--color-accent);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg { display: block; }

    .header-title { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 1px; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 6px;
      padding: 14px 16px 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: 0.5px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .tab-btn.active {
      background: var(--color-accent);
      color: #fff;
      border-color: var(--color-accent);
    }

    .tab-btn:not(.active):active { background: var(--color-surface-2); }

    /* ── Content ── */
    .content {
      flex: 1;
      padding: 14px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Card / Section ── */
    .card {
      background: var(--color-surface);
      border: 0.5px solid var(--color-border-strong);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-inner { padding: 12px 14px; }

    /* ── API Key ── */
    .api-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 7px;
    }

    .api-row { display: flex; gap: 7px; align-items: center; }

    .api-input {
      flex: 1;
      border: 0.5px solid var(--color-border-strong);
      border-radius: var(--radius-xs);
      padding: 8px 10px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.03em;
      background: var(--color-surface-2);
      color: var(--color-text-primary);
      outline: none;
      min-width: 0;
    }

    .api-input:focus { border-color: var(--color-accent); }

    .api-badge {
      font-size: 11px;
      color: var(--color-text-tertiary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Upload zone ── */
    .upload-zone {
      background: var(--color-surface);
      border: 0.5px dashed var(--color-border-strong);
      border-radius: var(--radius);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.12s;
      text-align: center;
    }

    .upload-zone:active { background: var(--color-surface-2); }

    .upload-zone-icon { font-size: 34px; line-height: 1; }
    .upload-zone-title { font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
    .upload-zone-sub { font-size: 12px; color: var(--color-text-secondary); }

    /* ── Image list ── */
    .image-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .image-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 0.5px solid var(--color-border);
      transition: background 0.12s;
    }

    .image-item:last-child { border-bottom: none; }
    .image-item.done { background: var(--color-success-bg); }
    .image-item.error { background: var(--color-error-bg); }

    @keyframes pulse-bg {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .image-item.loading { animation: pulse-bg 1.1s ease-in-out infinite; }

    .image-thumb {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-xs);
      object-fit: cover;
      border: 0.5px solid var(--color-border);
      flex-shrink: 0;
    }

    .image-info { flex: 1; min-width: 0; }
    .image-name { font-size: 13px; font-weight: 600; }

    .image-status {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .image-item.done .image-status { color: var(--color-success); }
    .image-item.error .image-status { color: var(--color-error); }

    .image-status-icon { font-size: 18px; flex-shrink: 0; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--color-border-strong);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    /* ── Process button ── */
    .process-btn {
      width: 100%;
      padding: 14px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .process-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .process-btn:not(:disabled):active { opacity: 0.82; }

    /* ── Log box ── */
    .log-box {
      background: var(--color-surface);
      border: 0.5px solid var(--color-border-strong);
      border-radius: var(--radius);
      padding: 10px 12px;
      height: 130px;
      overflow-y: auto;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--color-text-secondary);
      scroll-behavior: smooth;
    }

    .log-box:empty::before {
      content: 'Loggar visas här under bearbetning…';
      color: var(--color-text-tertiary);
      font-style: italic;
    }

    .log-line { }
    .log-line.ok { color: var(--color-success); }
    .log-line.err { color: var(--color-error); }
    .log-line.info { color: var(--color-accent); }

    /* ── Summary ── */
    .summary-box {
      background: var(--color-success-bg);
      border: 0.5px solid var(--color-success-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .summary-icon { font-size: 24px; flex-shrink: 0; }

    .summary-title { font-size: 14px; font-weight: 600; }
    .summary-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 3px; }

    .summary-link-btn {
      background: var(--color-success);
      color: #fff;
      border: none;
      border-radius: var(--radius-xs);
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      margin-top: 6px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Search tab ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      gap: 10px;
      text-align: center;
    }

    .empty-icon { font-size: 52px; opacity: 0.35; }
    .empty-title { font-size: 17px; font-weight: 600; }
    .empty-sub { font-size: 13px; color: var(--color-text-secondary); }

    .kof-count {
      font-size: 12px;
      color: var(--color-text-secondary);
      text-align: right;
      padding-bottom: 2px;
    }

    .search-row { display: flex; gap: 8px; }

    .kof-input {
      flex: 1;
      border: 0.5px solid var(--color-border-strong);
      border-radius: var(--radius);
      padding: 13px 15px;
      font-size: 22px;
      letter-spacing: 0.14em;
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: var(--color-surface);
      color: var(--color-text-primary);
      outline: none;
      min-width: 0;
      -moz-appearance: textfield;
    }

    .kof-input::-webkit-inner-spin-button,
    .kof-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    .kof-input:focus { border-color: var(--color-accent); }

    .search-btn {
      padding: 13px 18px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .search-btn:active { opacity: 0.82; }

    /* ── Result card ── */
    .result-card {
      border-radius: var(--radius);
      border: 0.5px solid;
      overflow: hidden;
    }

    .result-card.found {
      background: var(--color-success-bg);
      border-color: var(--color-success-border);
    }

    .result-card.notfound {
      background: var(--color-error-bg);
      border-color: var(--color-error-border);
    }

    .result-card-body { padding: 16px; }

    .result-route {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .result-store {
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .result-boxes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .result-box {
      background: var(--color-surface);
      border: 0.5px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      padding: 10px 8px;
      text-align: center;
    }

    .result-box-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .result-box-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .result-box-value.empty { color: var(--color-text-tertiary); }

    .result-header {
      background: var(--color-success);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .result-header.error-header { background: var(--color-error); }

    .result-header-text {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .notfound-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-error);
      margin-bottom: 6px;
    }

    .notfound-sub { font-size: 13px; color: var(--color-text-secondary); }

    /* ── Divider ── */
    .divider {
      height: 0.5px;
      background: var(--color-border);
      margin: 0 -14px;
    }

    /* ── Util ── */
    .hidden { display: none !important; }
    .flex-col { display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17a2 2 0 1 0 4 0a2 2 0 0 0-4 0"/>
        <path d="M17 17a2 2 0 1 0 4 0a2 2 0 0 0-4 0"/>
        <path d="M5 17H3V6a1 1 0 0 1 1-1h9v12"/>
        <path d="M13 6h5l3 5v6h-2"/>
        <path d="M9 17h6"/>
      </svg>
    </div>
    <div>
      <div class="header-title">Rutt-scanner</div>
      <div class="header-sub">Kyl &amp; Frys Expressen</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-scan" onclick="switchTab('scan')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7h1a2 2 0 0 0 2-2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2"/>
        <circle cx="12" cy="13" r="3"/>
      </svg>
      Scanna
    </button>
    <button class="tab-btn" id="tab-search" onclick="switchTab('search')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="7"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      Sök KOF
    </button>
  </div>

  <!-- ════ SCAN TAB ════ -->
  <div id="pane-scan" class="content flex-col">

    <!-- API Key -->
    <div class="card">
      <div class="card-inner">
        <div class="api-label">Anthropic API-nyckel</div>
        <div class="api-row">
          <input
            type="password"
            class="api-input"
            id="apiKeyInput"
            placeholder="sk-ant-api03-…"
            autocomplete="off"
            spellcheck="false"
            oninput="state.apiKey = this.value"
          >
          <span class="api-badge">Sparas ej</span>
        </div>
      </div>
    </div>

    <!-- Upload zone -->
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-zone-icon">📷</div>
      <div class="upload-zone-title">Fotografera ett papper</div>
      <div class="upload-zone-sub">Klicka för att välja bild(er) — stöder flera</div>
    </div>
    <input
      type="file"
      id="fileInput"
      accept="image/*"
      multiple
      capture="environment"
      style="display:none"
      onchange="handleFileSelect(this)"
    >

    <!-- Image list -->
    <div class="card hidden" id="imageListCard">
      <div class="image-list" id="imageList"></div>
    </div>

    <!-- Process button -->
    <button class="process-btn" id="processBtn" disabled onclick="processImages()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14m7-7-7 7-7-7"/>
      </svg>
      <span id="processBtnLabel">Läs in 0 bilder</span>
    </button>

    <!-- Log box -->
    <div class="log-box" id="logBox"></div>

    <!-- Summary -->
    <div class="summary-box hidden" id="summaryBox">
      <div class="summary-icon">✅</div>
      <div>
        <div class="summary-title" id="summaryTitle"></div>
        <div class="summary-sub">Klart att använda</div>
        <button class="summary-link-btn" onclick="switchTab('search')">Öppna Sök KOF →</button>
      </div>
    </div>

  </div>

  <!-- ════ SEARCH TAB ════ -->
  <div id="pane-search" class="content hidden">

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📋</div>
      <div class="empty-title">Inga ruttdata inlästa</div>
      <div class="empty-sub">Scanna ruttlistorna först och kom sedan tillbaka hit</div>
    </div>

    <!-- Search UI -->
    <div id="searchContent" class="hidden flex-col">
      <div class="kof-count" id="kofCount"></div>
      <div class="search-row">
        <input
          type="number"
          class="kof-input"
          id="kofInput"
          placeholder="123456"
          maxlength="6"
          inputmode="numeric"
          pattern="[0-9]*"
          onkeydown="if(event.key === 'Enter') searchKof()"
          oninput="limitKofInput(this)"
        >
        <button class="search-btn" onclick="searchKof()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="7"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          Sök
        </button>
      </div>
      <div id="resultArea"></div>
    </div>

  </div>

</div>
<script>
  /* ═══════════════════════════════════════════════
     STATE
  ═══════════════════════════════════════════════ */
  const state = {
    activeTab: 'scan',
    images: [],          // { id, file, dataUrl, name, status, statusMsg }
    routeData: {},       // kof (string) → { route, store, pall, bur, hlv }
    isProcessing: false,
    apiKey: '',
    nextId: 1,
  };

  /* ═══════════════════════════════════════════════
     TAB SWITCHING
  ═══════════════════════════════════════════════ */
  function switchTab(tab) {
    state.activeTab = tab;
    document.getElementById('pane-scan').classList.toggle('hidden', tab !== 'scan');
    document.getElementById('pane-search').classList.toggle('hidden', tab !== 'search');
    document.getElementById('tab-scan').className = 'tab-btn' + (tab === 'scan' ? ' active' : '');
    document.getElementById('tab-search').className = 'tab-btn' + (tab === 'search' ? ' active' : '');
    if (tab === 'search') renderSearchUI();
  }

  /* ═══════════════════════════════════════════════
     FILE HANDLING
  ═══════════════════════════════════════════════ */
  function handleFileSelect(input) {
    const files = Array.from(input.files);
    if (!files.length) return;

    files.forEach(file => {
      const id = state.nextId++;
      const reader = new FileReader();
      reader.onload = e => {
        state.images.push({
          id,
          file,
          dataUrl: e.target.result,
          name: file.name,
          status: 'pending',
          statusMsg: 'Väntar…',
        });
        renderImageList();
        updateProcessButton();
      };
      reader.readAsDataURL(file);
    });

    input.value = '';
  }

  /* ═══════════════════════════════════════════════
     IMAGE LIST RENDER
  ═══════════════════════════════════════════════ */
  function renderImageList() {
    const card = document.getElementById('imageListCard');
    const list = document.getElementById('imageList');

    if (state.images.length === 0) {
      card.classList.add('hidden');
      return;
    }
    card.classList.remove('hidden');

    list.innerHTML = state.images.map((img, i) => `
      <div class="image-item ${img.status}" id="img-row-${img.id}">
        <img class="image-thumb" src="${img.dataUrl}" alt="">
        <div class="image-info">
          <div class="image-name">Bild ${i + 1}</div>
          <div class="image-status">${escHtml(img.statusMsg)}</div>
        </div>
        <div class="image-status-icon">${statusIcon(img.status)}</div>
      </div>
    `).join('');
  }

  function statusIcon(status) {
    if (status === 'pending')  return '<span style="color:var(--color-text-tertiary);font-size:18px">⏳</span>';
    if (status === 'loading')  return '<div class="spinner"></div>';
    if (status === 'done')     return '<span style="color:var(--color-success);font-size:18px">✅</span>';
    if (status === 'error')    return '<span style="color:var(--color-error);font-size:18px">❌</span>';
    return '';
  }

  function updateImageItem(id, status, statusMsg) {
    const img = state.images.find(i => i.id === id);
    if (img) { img.status = status; img.statusMsg = statusMsg; }
    renderImageList();
  }

  /* ═══════════════════════════════════════════════
     PROCESS BUTTON STATE
  ═══════════════════════════════════════════════ */
  function updateProcessButton() {
    const pending = state.images.filter(i => i.status === 'pending').length;
    const btn = document.getElementById('processBtn');
    const lbl = document.getElementById('processBtnLabel');
    lbl.textContent = `Läs in ${pending} bild${pending === 1 ? '' : 'er'}`;
    btn.disabled = pending === 0 || state.isProcessing;
  }

  /* ═══════════════════════════════════════════════
     LOGGING
  ═══════════════════════════════════════════════ */
  function addLog(text, type = '') {
    const box = document.getElementById('logBox');
    const line = document.createElement('div');
    line.className = 'log-line' + (type ? ' ' + type : '');
    line.textContent = `[${timestamp()}] ${text}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function timestamp() {
    return new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  /* ═══════════════════════════════════════════════
     MAIN PROCESSING PIPELINE
  ═══════════════════════════════════════════════ */
  async function processImages() {
    if (state.isProcessing) return;

    if (!state.apiKey || state.apiKey.trim().length < 10) {
      alert('Ange din Anthropic API-nyckel (sk-ant-…) ovanför.');
      return;
    }

    const pending = state.images.filter(i => i.status === 'pending');
    if (pending.length === 0) return;

    state.isProcessing = true;
    updateProcessButton();
    document.getElementById('summaryBox').classList.add('hidden');

    addLog(`Startar bearbetning av ${pending.length} bild(er)…`, 'info');

    for (const img of pending) {
      const idx = state.images.indexOf(img) + 1;
      addLog(`[Bild ${idx}] Skickar till AI…`);
      updateImageItem(img.id, 'loading', 'Analyserar…');

      try {
        const result = await callClaudeApi(img.dataUrl);
        const count = storeEntries(result);
        const msg = `Rutt ${result.routeNumber} — ${count} poster inlästa`;
        updateImageItem(img.id, 'done', msg);
        addLog(`[Bild ${idx}] ✓ ${msg}`, 'ok');
      } catch (err) {
        const errMsg = String(err.message || err).slice(0, 120);
        updateImageItem(img.id, 'error', errMsg);
        addLog(`[Bild ${idx}] ✗ ${errMsg}`, 'err');
      }
    }

    const total = Object.keys(state.routeData).length;
    addLog(`Klar! Totalt ${total} KOF-nummer i databasen.`, 'ok');

    state.isProcessing = false;
    updateProcessButton();

    document.getElementById('summaryTitle').textContent = `${total} KOF-nummer klara`;
    document.getElementById('summaryBox').classList.remove('hidden');
  }

  /* ═══════════════════════════════════════════════
     ANTHROPIC API CALL
  ═══════════════════════════════════════════════ */
  async function callClaudeApi(dataUrl) {
    const match = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
    if (!match) throw new Error('Ogiltig bildfil');
    const mediaType  = match[1];
    const base64Data = match[2];

    const PROMPT = `Extract route info from this Swedish logistics route sheet. Return ONLY valid JSON, nothing else:
{"routeNumber":"1","entries":[{"kof":"369321","store":"PB LUGNETS ALLE 29 STHLM","pall":"1","bur":"","hlv":"","isS":false}]}
Rules:
- routeNumber: number after "Rutt " on the sheet
- kof: 6-digit number in leftmost column
- store: store name and address text
- pall/bur/hlv: value in that column, empty string if blank
- isS: false for rows BEFORE the blank separator row, true for rows AFTER it
Return only JSON, no markdown, no explanation.`;

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey.trim(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: mediaType, data: base64Data },
            },
            { type: 'text', text: PROMPT },
          ],
        }],
      }),
    });

    if (!response.ok) {
      let errMsg = `API-fel ${response.status}`;
      try {
        const errBody = await response.json();
        if (errBody?.error?.message) errMsg = errBody.error.message;
      } catch (_) {}
      throw new Error(errMsg);
    }

    const data = await response.json();
    const raw  = data.content?.[0]?.text?.trim() ?? '';

    // Strip markdown code fences if present
    let jsonStr = raw;
    const fenceMatch = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (fenceMatch) jsonStr = fenceMatch[1].trim();

    try {
      return JSON.parse(jsonStr);
    } catch (_) {
      throw new Error(`Kunde inte tolka AI-svaret: ${raw.slice(0, 80)}`);
    }
  }

  /* ═══════════════════════════════════════════════
     STORE EXTRACTED ENTRIES
  ═══════════════════════════════════════════════ */
  function storeEntries(parsed) {
    const routeNum = String(parsed.routeNumber ?? '?');
    let count = 0;

    for (const entry of (parsed.entries ?? [])) {
      const kof   = String(entry.kof ?? '').trim();
      if (!kof) continue;

      const route = entry.isS ? `S${routeNum}` : `Rutt ${routeNum}`;
      state.routeData[kof] = {
        route,
        store: entry.store ?? '',
        pall:  entry.pall  ?? '',
        bur:   entry.bur   ?? '',
        hlv:   entry.hlv   ?? '',
      };
      count++;
    }

    return count;
  }

  /* ═══════════════════════════════════════════════
     SEARCH TAB
  ═══════════════════════════════════════════════ */
  function renderSearchUI() {
    const total = Object.keys(state.routeData).length;
    const empty   = document.getElementById('emptyState');
    const content = document.getElementById('searchContent');

    if (total === 0) {
      empty.classList.remove('hidden');
      content.classList.add('hidden');
    } else {
      empty.classList.add('hidden');
      content.classList.remove('hidden');
      document.getElementById('kofCount').textContent = `${total} KOF-nummer inlästa`;
    }
  }

  function limitKofInput(input) {
    const val = input.value.replace(/\D/g, '').slice(0, 6);
    input.value = val;
  }

  function searchKof() {
    const input = document.getElementById('kofInput');
    const raw   = input.value.trim();
    if (!raw) return;

    // Try exact match first, then zero-padded to 6 digits
    const kof6   = raw.padStart(6, '0');
    const data   = state.routeData[raw] ?? state.routeData[kof6];
    const resultArea = document.getElementById('resultArea');

    if (data) {
      resultArea.innerHTML = `
        <div class="result-card found">
          <div class="result-header">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
            <span class="result-header-text">Hittad — KOF ${escHtml(raw)}</span>
          </div>
          <div class="result-card-body">
            <div class="result-route">${escHtml(data.route)}</div>
            <div class="result-store">${escHtml(data.store)}</div>
            <div class="result-boxes">
              <div class="result-box">
                <div class="result-box-label">PALL</div>
                <div class="result-box-value ${data.pall ? '' : 'empty'}">${escHtml(data.pall) || '—'}</div>
              </div>
              <div class="result-box">
                <div class="result-box-label">BUR</div>
                <div class="result-box-value ${data.bur ? '' : 'empty'}">${escHtml(data.bur) || '—'}</div>
              </div>
              <div class="result-box">
                <div class="result-box-label">HLV</div>
                <div class="result-box-value ${data.hlv ? '' : 'empty'}">${escHtml(data.hlv) || '—'}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    } else {
      resultArea.innerHTML = `
        <div class="result-card notfound">
          <div class="result-header error-header">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            <span class="result-header-text">Hittades inte — KOF ${escHtml(raw)}</span>
          </div>
          <div class="result-card-body">
            <div class="notfound-title">KOF ${escHtml(raw)} finns inte</div>
            <div class="notfound-sub">Kontrollera numret eller scanna om pappren</div>
          </div>
        </div>
      `;
    }
  }

  /* ═══════════════════════════════════════════════
     UTILITIES
  ═══════════════════════════════════════════════ */
  function escHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ═══════════════════════════════════════════════
     INIT
  ═══════════════════════════════════════════════ */
  renderSearchUI();
</script>
</body>
