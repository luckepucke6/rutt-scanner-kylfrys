<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Rutt-scanner</title>
  <style>
    :root {
      --color-bg: #f2f2f7;
      --color-surface: #ffffff;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #6b6b6b;
      --color-border: rgba(0, 0, 0, 0.10);
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #000000;
        --color-surface: #1c1c1e;
        --color-text-primary: #f2f2f7;
        --color-text-secondary: #8e8e93;
        --color-border: rgba(255, 255, 255, 0.10);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text-primary);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 40px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      opacity: 0.7;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 15px;
      color: var(--color-text-secondary);
      line-height: 1.5;
    }
    p + p {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x1F6D1;</div>
    <h1>Rutt-scanner är tillfälligt avstängd</h1>
    <p>Appen är inte tillgänglig just nu.</p>
    <p>Kontakta Lucas för mer information.</p>
    <p style="margin-top: 20px; font-size: 13px; opacity: 0.5;">The app is temporarily unavailable.</p>
  </div>
</body>
</html>
